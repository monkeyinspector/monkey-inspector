<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Monkey Inspector 0.2</title>

    <style>
        :root{
            color-scheme:dark;
            font-family:Inter,system-ui,sans-serif
        }

        *{box-sizing:border-box}

        body{
            margin:0;
            background:#101217;
            color:#e7ebf2;
            overflow:hidden
        }

        header{
            height:48px;
            display:flex;
            align-items:center;
            gap:10px;
            padding:0 12px;
            background:#171a20;
            border-bottom:1px solid #2a303a
        }

        header strong{white-space:nowrap}

        header input{
            width:min(360px,36vw);
            background:#101319;
            border:1px solid #343c49;
            color:inherit;
            border-radius:6px;
            padding:6px 9px
        }

        #status{
            margin-left:auto;
            font-size:12px;
            opacity:.65
        }

        button{
            background:#242b35;
            color:inherit;
            border:1px solid #3a4351;
            border-radius:6px;
            padding:5px 8px;
            cursor:pointer
        }

        button:hover{background:#2d3643}

        main{
            height:calc(100vh - 48px);
            display:grid;
            grid-template-columns:31% 32% 37%
        }

        .panel{
            min-width:0;
            overflow:auto;
            border-right:1px solid #2a303a
        }

        h2{
            position:sticky;
            top:0;
            z-index:3;
            margin:0;
            padding:9px 11px;
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:.12em;
            background:#171a20;
            border-bottom:1px solid #2a303a
        }

        .section{padding:8px 9px 15px}

        ul.tree,
        ul.tree ul{
            list-style:none;
            margin:0;
            padding-left:15px
        }

        ul.tree{padding-left:0}

        .row{
            display:flex;
            align-items:center;
            gap:6px;
            min-height:25px;
            padding:2px 5px;
            border-radius:5px;
            cursor:pointer;
            white-space:nowrap
        }

        .row:hover{background:#222832}

        .row.selected{background:#2b3543}

        .twisty{
            width:12px;
            opacity:.65;
            flex:none
        }

        .kind{
            font-size:9px;
            padding:1px 4px;
            border:1px solid #3b4553;
            border-radius:4px;
            opacity:.8
        }

        .name{
            overflow:hidden;
            text-overflow:ellipsis
        }

        .muted{
            opacity:.5;
            font-size:11px;
            overflow:hidden;
            text-overflow:ellipsis
        }

        .card{
            border:1px solid #303743;
            background:#171b22;
            border-radius:7px;
            padding:9px;
            margin:7px 0
        }

        .kv{
            display:grid;
            grid-template-columns:115px minmax(0,1fr);
            gap:5px 9px;
            font-size:12px
        }

        .kv b{
            opacity:.6;
            font-weight:500
        }

        .chain{
            display:flex;
            flex-direction:column;
            gap:3px;
            font:11px ui-monospace,monospace
        }

        .chain div::before{
            content:"↳ ";
            opacity:.4
        }

        .fields{
            width:100%;
            border-collapse:collapse;
            font-size:11px
        }

        .fields th,
        .fields td{
            padding:5px 6px;
            border-bottom:1px solid #292f39;
            text-align:left;
            vertical-align:top
        }

        .fields th{
            opacity:.55;
            font-weight:500
        }

        .empty{
            padding:14px;
            opacity:.5;
            font-size:12px
        }

        .tabs{
            position:sticky;
            top:0;
            z-index:4;
            display:flex;
            gap:5px;
            padding:7px;
            background:#171a20;
            border-bottom:1px solid #2a303a
        }

        .tabs button.active{
            background:#394556
        }

        .tab{
            display:none;
            padding:8px
        }

        .tab.active{display:block}

        svg.graph{
            width:100%;
            min-height:280px;
            background:#12151a;
            border:1px solid #2c333e;
            border-radius:7px
        }

        .nodeBox{
            fill:#1d232c;
            stroke:#465267
        }

        .nodeBox.observed{
            stroke-width:2
        }

        .nodeText{
            font:10px ui-monospace,monospace;
            fill:#edf1f7
        }

        .edgeText{
            font:9px ui-monospace,monospace;
            fill:#aab4c3
        }

        .edgeLine{
            stroke:#68788e;
            stroke-width:1.1;
            fill:none;
            marker-end:url(#arrow)
        }

        .edgeField{
            stroke-dasharray:4 3
        }

        .metrics{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:7px;
            margin-bottom:8px
        }

        .metric{
            border:1px solid #303743;
            background:#171b22;
            border-radius:7px;
            padding:8px
        }

        .metric b{
            display:block;
            font-size:10px;
            opacity:.55
        }

        .metric span{
            font:13px ui-monospace,monospace
        }

        .small{
            font-size:11px;
            opacity:.65
        }
    </style>
</head>

<body>

<header>
    <strong>🐒 Monkey Inspector <span class="small">0.2</span></strong>
    <input id="search" placeholder="Search scene / class / object…">
    <button id="refresh">Refresh</button>
    <span id="status">connecting…</span>
</header>

<main>

    <section class="panel">
        <h2>Scene Graph</h2>
        <div id="scene" class="section"></div>

        <h2>App States</h2>
        <div id="states" class="section"></div>
    </section>

    <section class="panel">
        <h2>Selection / Live Properties</h2>
        <div id="details" class="section">
            <div class="empty">Select an object.</div>
        </div>

        <h2>Watched Objects</h2>
        <div id="watched" class="section"></div>
    </section>

    <section class="panel">

        <div class="tabs">
            <button data-tab="architecture" class="active">
                Architecture
            </button>

            <button data-tab="workflow">
                Workflow
            </button>

            <button data-tab="engine">
                Engine
            </button>
        </div>

        <div id="architecture" class="tab active">
            <svg id="architectureGraph" class="graph"></svg>
            <div id="architectureTable"></div>
        </div>

        <div id="workflow" class="tab">
            <div style="text-align:right">
                <button id="clearTrace">Clear trace</button>
            </div>

            <svg id="workflowGraph" class="graph"></svg>
            <div id="traceTable"></div>
        </div>

        <div id="engine" class="tab">
            <div style="text-align:right">
                <button id="clearEngine">
                    Clear engine profile
                </button>
            </div>

            <div id="engineMetrics" class="metrics"></div>

            <svg id="engineGraph" class="graph"></svg>
            <div id="engineTable"></div>
        </div>

    </section>

</main>

<script>
    let latest = null
    let selectedId = null

    const $ = id => document.getElementById(id)

    const esc = s =>
        String(s ?? "").replace(
            /[&<>"']/g,
            c => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            })[c]
        )

    const short = name =>
        (name || "").split(".").pop()

    const query = () =>
        $("search").value
            .trim()
            .toLowerCase()

    const fmtNs = value => {
        const n = Number(value || 0)

        if (n >= 1e9)
            return (n / 1e9).toFixed(2) + " s"

        if (n >= 1e6)
            return (n / 1e6).toFixed(2) + " ms"

        if (n >= 1e3)
            return (n / 1e3).toFixed(1) + " µs"

        return n.toFixed(0) + " ns"
    }

    function matches(object) {
        const q = query()

        if (!q)
            return true

        return [
            object?.name,
            object?.kind,
            object?.classInfo?.name,
            object?.classInfo?.simpleName,
            object?.preview
        ].some(
            value =>
                String(value ?? "")
                    .toLowerCase()
                    .includes(q)
        )
    }

    function subtreeMatches(node) {
        if (matches(node))
            return true

        if ((node.controls || []).some(matches))
            return true

        return (node.children || [])
            .some(subtreeMatches)
    }

    function rowFor(
        object,
        label,
        kind
    ) {
        const div =
            document.createElement("div")

        div.className =
            "row"
            + (
                selectedId === object.id
                    ? " selected"
                    : ""
            )

        div.innerHTML =
            `<span class="kind">${esc(kind)}</span>`
            + `<span class="name">${esc(label)}</span>`
            + `<span class="muted">${esc(short(object.classInfo?.name))}</span>`

        div.onclick = () => {
            selectedId = object.id
            renderAll()
        }

        return div
    }

    function spatialLi(node) {
        if (!subtreeMatches(node))
            return null

        const li =
            document.createElement("li")

        const children =
            (node.children || [])
                .filter(subtreeMatches)

        const row =
            rowFor(
                node,
                node.name,
                node.kind
            )

        const twisty =
            document.createElement("span")

        twisty.className = "twisty"
        twisty.textContent =
            children.length
                ? "▾"
                : ""

        row.prepend(twisty)
        li.appendChild(row)

        for (const control of node.controls || []) {
            if (
                query()
                && !matches(control)
            ) continue

            const wrap =
                document.createElement("div")

            wrap.style.paddingLeft =
                "28px"

            wrap.appendChild(
                rowFor(
                    control,
                    control.name
                    || short(control.classInfo?.name),
                    "Control"
                )
            )

            li.appendChild(wrap)
        }

        if (children.length) {
            const ul =
                document.createElement("ul")

            for (const child of children) {
                const item =
                    spatialLi(child)

                if (item)
                    ul.appendChild(item)
            }

            li.appendChild(ul)

            twisty.onclick = event => {
                event.stopPropagation()

                const hidden =
                    ul.style.display === "none"

                ul.style.display =
                    hidden
                        ? ""
                        : "none"

                twisty.textContent =
                    hidden
                        ? "▾"
                        : "▸"
            }
        }

        return li
    }

    function renderScene() {
        const root = $("scene")

        root.innerHTML = ""

        const ul =
            document.createElement("ul")

        ul.className = "tree"

        for (const node of latest.sceneRoots || []) {
            const item =
                spatialLi(node)

            if (item)
                ul.appendChild(item)
        }

        if (!ul.children.length) {
            root.innerHTML =
                '<div class="empty">No matches.</div>'
        } else {
            root.appendChild(ul)
        }
    }

    function renderObjects(
        target,
        objects,
        kind
    ) {
        const root = $(target)

        root.innerHTML = ""

        const filtered =
            (objects || [])
                .filter(matches)

        if (!filtered.length) {
            root.innerHTML =
                '<div class="empty">None</div>'

            return
        }

        for (const object of filtered) {
            root.appendChild(
                rowFor(
                    object,
                    object.name
                    || short(object.classInfo?.name),
                    kind
                )
            )
        }
    }

    function walkSpatial(
        node,
        predicate
    ) {
        if (predicate(node))
            return node

        for (const control of node.controls || []) {
            if (predicate(control))
                return control
        }

        for (const child of node.children || []) {
            const result =
                walkSpatial(
                    child,
                    predicate
                )

            if (result)
                return result
        }

        return null
    }

    function findSelected() {
        if (!selectedId)
            return null

        for (const root of latest.sceneRoots || []) {
            const result =
                walkSpatial(
                    root,
                    object =>
                        object.id === selectedId
                )

            if (result)
                return result
        }

        for (
            const object of [
            ...(latest.appStates || []),
            ...(latest.watchedObjects || [])
        ]
            ) {
            if (object.id === selectedId)
                return object
        }

        return null
    }

    function renderDetails() {
        const root = $("details")
        const object = findSelected()

        if (!object) {
            root.innerHTML =
                '<div class="empty">Select something.</div>'

            return
        }

        const info =
            object.classInfo || {}

        let props = ""

        for (
            const key of [
            "name",
            "kind",
            "localTranslation",
            "worldTranslation",
            "localRotation",
            "localScale",
            "worldBound",
            "cullHint",
            "queueBucket",
            "meshMode",
            "triangles",
            "vertices",
            "enabled",
            "initialized",
            "preview"
        ]
            ) {
            if (object[key] !== undefined) {
                props +=
                    `<b>${esc(key)}</b>`
                    + `<span>${esc(object[key])}</span>`
            }
        }

        const fields =
            (object.fields || [])
                .map(
                    field =>
                        `<tr>`
                        + `<td>${esc(field.name)}</td>`
                        + `<td>${esc(short(field.type))}</td>`
                        + `<td>${esc(field.value)}</td>`
                        + `</tr>`
                )
                .join("")

        root.innerHTML =
            `<div class="card">`
            + `<div class="kv">${props}</div>`
            + `</div>`
            + `<div class="card">`
            + `<div class="chain">`
            + (info.hierarchy || [])
                .map(
                    name =>
                        `<div>${esc(name)}</div>`
                )
                .join("")
            + `</div>`
            + (
                info.interfaces?.length
                    ? `<div class="small">interfaces<br>`
                    + info.interfaces
                        .map(esc)
                        .join("<br>")
                    + `</div>`
                    : ""
            )
            + `</div>`
            + (
                fields
                    ? `<div class="card">`
                    + `<table class="fields">`
                    + `<thead>`
                    + `<tr>`
                    + `<th>field</th>`
                    + `<th>type</th>`
                    + `<th>live value</th>`
                    + `</tr>`
                    + `</thead>`
                    + `<tbody>${fields}</tbody>`
                    + `</table>`
                    + `</div>`
                    : ""
            )
    }

    function defs() {
        return `
    <defs>
        <marker
            id="arrow"
            markerWidth="8"
            markerHeight="8"
            refX="7"
            refY="3"
            orient="auto"
        >
            <path
                d="M0,0 L0,6 L8,3 z"
                fill="#68788e"
            />
        </marker>
    </defs>
    `
    }

    function renderFlowGraph(
        id,
        data,
        emptyText,
        maxNodes = 70
    ) {
        const svg = $(id)

        const nodes =
            (data?.nodes || [])
                .slice()
                .sort(
                    (a,b) =>
                        Number(
                            b.totalNanos || b.calls
                        )
                        -
                        Number(
                            a.totalNanos || a.calls
                        )
                )
                .slice(
                    0,
                    maxNodes
                )

        const allowed =
            new Set(
                nodes.map(
                    node => node.name
                )
            )

        const edges =
            (data?.edges || [])
                .filter(
                    edge =>
                        allowed.has(edge.from)
                        && allowed.has(edge.to)
                )

        svg.innerHTML = defs()

        if (!nodes.length) {
            svg.setAttribute(
                "viewBox",
                "0 0 600 120"
            )

            svg.innerHTML +=
                `<text x="18" y="42" class="nodeText" opacity=".55">`
                + `${esc(emptyText)}`
                + `</text>`

            return
        }

        const incoming =
            new Map(
                nodes.map(
                    node => [
                        node.name,
                        0
                    ]
                )
            )

        for (const edge of edges) {
            incoming.set(
                edge.to,
                (incoming.get(edge.to) || 0)
                + 1
            )
        }

        const depth =
            new Map()

        const queue =
            nodes
                .filter(
                    node =>
                        (incoming.get(node.name) || 0)
                        === 0
                )
                .map(
                    node => node.name
                )

        for (const name of queue)
            depth.set(name,0)

        while (queue.length) {
            const current =
                queue.shift()

            const currentDepth =
                depth.get(current) || 0

            for (
                const edge of edges.filter(
                edge =>
                    edge.from === current
            )
                ) {
                if (!depth.has(edge.to)) {
                    depth.set(
                        edge.to,
                        Math.min(
                            6,
                            currentDepth + 1
                        )
                    )

                    queue.push(edge.to)
                }
            }
        }

        for (const node of nodes) {
            if (!depth.has(node.name))
                depth.set(node.name,0)
        }

        const groups = {}

        for (const node of nodes) {
            const d =
                depth.get(node.name)

            ;(groups[d] ??= [])
                .push(node.name)
        }

        const positions =
            new Map()

        const columnWidth = 180
        const rowHeight = 54

        let maxRows = 1
        let maxDepth = 0

        for (
            const [d,array]
            of Object.entries(groups)
            ) {
            maxDepth =
                Math.max(
                    maxDepth,
                    Number(d)
                )

            maxRows =
                Math.max(
                    maxRows,
                    array.length
                )

            array.forEach(
                (name,index) =>
                    positions.set(
                        name,
                        {
                            x:
                                15
                                + Number(d)
                                * columnWidth,
                            y:
                                18
                                + index
                                * rowHeight
                        }
                    )
            )
        }

        const width =
            Math.max(
                620,
                (maxDepth + 1)
                * columnWidth
                + 20
            )

        const height =
            Math.max(
                260,
                maxRows
                * rowHeight
                + 30
            )

        svg.setAttribute(
            "viewBox",
            `0 0 ${width} ${height}`
        )

        for (const edge of edges) {
            const a =
                positions.get(edge.from)

            const b =
                positions.get(edge.to)

            if (!a || !b)
                continue

            const x1 = a.x + 145
            const y1 = a.y + 16

            const x2 = b.x
            const y2 = b.y + 16

            svg.innerHTML +=
                `<line class="edgeLine"`
                + ` x1="${x1}" y1="${y1}"`
                + ` x2="${x2}" y2="${y2}"/>`
                + `<text class="edgeText"`
                + ` x="${(x1+x2)/2}"`
                + ` y="${(y1+y2)/2-3}">`
                + `${esc(edge.calls ?? "")}`
                + `</text>`
        }

        for (const node of nodes) {
            const p =
                positions.get(node.name)

            const average =
                node.calls
                    ? Number(node.totalNanos || 0)
                    / Number(node.calls)
                    : 0

            svg.innerHTML +=
                `<rect class="nodeBox"`
                + ` x="${p.x}" y="${p.y}"`
                + ` width="145" height="33"`
                + ` rx="6"/>`
                + `<text class="nodeText"`
                + ` x="${p.x+6}" y="${p.y+13}">`
                + `${esc(short(node.name)).slice(0,22)}`
                + `</text>`
                + `<text class="edgeText"`
                + ` x="${p.x+6}" y="${p.y+27}">`
                + `${Number(node.calls || 0)}× · ${esc(fmtNs(average))}`
                + `</text>`
        }
    }

    function renderWorkflow() {
        const trace =
            latest.trace || {}

        renderFlowGraph(
            "workflowGraph",
            trace,
            "No trace data. Use InspectorTrace.runSpan(...)"
        )

        const nodes =
            (trace.nodes || [])
                .slice()
                .sort(
                    (a,b) =>
                        Number(b.selfNanos || 0)
                        -
                        Number(a.selfNanos || 0)
                )
                .slice(0,40)

        $("traceTable").innerHTML =
            nodes.length
                ? `<div class="card">`
                + `<table class="fields">`
                + `<thead><tr>`
                + `<th>span</th>`
                + `<th>calls</th>`
                + `<th>avg</th>`
                + `<th>self</th>`
                + `<th>max</th>`
                + `<th>fail</th>`
                + `</tr></thead>`
                + `<tbody>`
                + nodes.map(
                    node =>
                        `<tr>`
                        + `<td>${esc(node.name)}</td>`
                        + `<td>${node.calls}</td>`
                        + `<td>${esc(fmtNs(node.calls ? node.totalNanos/node.calls : 0))}</td>`
                        + `<td>${esc(fmtNs(node.selfNanos))}</td>`
                        + `<td>${esc(fmtNs(node.maxNanos))}</td>`
                        + `<td>${node.failures || 0}</td>`
                        + `</tr>`
                ).join("")
                + `</tbody>`
                + `</table>`
                + `</div>`
                : ""
    }

    function renderEngine() {
        const profile =
            latest.engineProfile || {}

        renderFlowGraph(
            "engineGraph",
            profile,
            "Engine profiling disabled.",
            80
        )

        $("engineMetrics").innerHTML =
            `<div class="metric">`
            + `<b>frames</b>`
            + `<span>${Number(profile.frames || 0)}</span>`
            + `</div>`
            + `<div class="metric">`
            + `<b>avg frame</b>`
            + `<span>${esc(fmtNs(profile.averageFrameNanos || 0))}</span>`
            + `</div>`
            + `<div class="metric">`
            + `<b>max frame</b>`
            + `<span>${esc(fmtNs(profile.maxFrameNanos || 0))}</span>`
            + `</div>`

        const nodes =
            (profile.nodes || [])
                .slice()
                .sort(
                    (a,b) =>
                        Number(b.totalNanos || 0)
                        -
                        Number(a.totalNanos || 0)
                )
                .slice(0,50)

        $("engineTable").innerHTML =
            nodes.length
                ? `<div class="card">`
                + `<table class="fields">`
                + `<thead><tr>`
                + `<th>jME phase</th>`
                + `<th>calls</th>`
                + `<th>avg</th>`
                + `<th>max</th>`
                + `</tr></thead>`
                + `<tbody>`
                + nodes.map(
                    node =>
                        `<tr>`
                        + `<td>${esc(node.name)}</td>`
                        + `<td>${node.calls}</td>`
                        + `<td>${esc(fmtNs(node.calls ? node.totalNanos/node.calls : 0))}</td>`
                        + `<td>${esc(fmtNs(node.maxNanos))}</td>`
                        + `</tr>`
                ).join("")
                + `</tbody>`
                + `</table>`
                + `</div>`
                : ""
    }

    function renderArchitecture() {
        const data =
            latest.architecture
            || {
                nodes:[],
                edges:[]
            }

        let nodes =
            data.nodes || []

        let edges =
            data.edges || []

        const q =
            query()

        if (q) {
            const hit =
                new Set(
                    nodes
                        .filter(
                            node =>
                                (
                                    node.name
                                    + " "
                                    + node.simpleName
                                    + " "
                                    + node.packageName
                                )
                                    .toLowerCase()
                                    .includes(q)
                        )
                        .map(
                            node => node.name
                        )
                )

            for (const edge of edges) {
                if (
                    hit.has(edge.from)
                    || hit.has(edge.to)
                ) {
                    hit.add(edge.from)
                    hit.add(edge.to)
                }
            }

            nodes =
                nodes.filter(
                    node =>
                        hit.has(node.name)
                )

            edges =
                edges.filter(
                    edge =>
                        hit.has(edge.from)
                        && hit.has(edge.to)
                )
        }

        nodes =
            nodes.slice(0,100)

        const allowed =
            new Set(
                nodes.map(
                    node => node.name
                )
            )

        edges =
            edges.filter(
                edge =>
                    allowed.has(edge.from)
                    && allowed.has(edge.to)
            )

        const svg =
            $("architectureGraph")

        svg.innerHTML =
            defs()

        if (!nodes.length) {
            svg.setAttribute(
                "viewBox",
                "0 0 600 120"
            )

            svg.innerHTML +=
                `<text x="18" y="42"`
                + ` class="nodeText"`
                + ` opacity=".55">`
                + `No classes.`
                + `</text>`

            return
        }

        const inheritance =
            edges.filter(
                edge =>
                    edge.kind === "extends"
                    || edge.kind === "implements"
            )

        const depth =
            new Map()

        function getDepth(
            name,
            seen = new Set()
        ) {
            if (depth.has(name))
                return depth.get(name)

            if (seen.has(name))
                return 0

            seen.add(name)

            const parents =
                inheritance
                    .filter(
                        edge =>
                            edge.from === name
                    )
                    .map(
                        edge => edge.to
                    )

            const value =
                parents.length
                    ? 1 + Math.max(
                    ...parents.map(
                        parent =>
                            getDepth(
                                parent,
                                new Set(seen)
                            )
                    )
                )
                    : 0

            depth.set(
                name,
                Math.min(
                    value,
                    7
                )
            )

            return depth.get(name)
        }

        for (const node of nodes)
            getDepth(node.name)

        const groups = {}

        for (const node of nodes) {
            const d =
                depth.get(node.name)

            ;(groups[d] ??= [])
                .push(node)
        }

        const positions =
            new Map()

        const columnWidth = 190
        const rowHeight = 52

        let maxRows = 1
        let maxDepth = 0

        for (
            const [d,array]
            of Object.entries(groups)
            ) {
            maxDepth =
                Math.max(
                    maxDepth,
                    Number(d)
                )

            maxRows =
                Math.max(
                    maxRows,
                    array.length
                )

            array.sort(
                (a,b) =>
                    a.name.localeCompare(
                        b.name
                    )
            )

            array.forEach(
                (node,index) =>
                    positions.set(
                        node.name,
                        {
                            x:
                                15
                                + Number(d)
                                * columnWidth,
                            y:
                                16
                                + index
                                * rowHeight
                        }
                    )
            )
        }

        svg.setAttribute(
            "viewBox",
            `0 0 ${
                Math.max(
                    620,
                    (maxDepth + 1)
                    * columnWidth
                    + 20
                )
            } ${
                Math.max(
                    280,
                    maxRows
                    * rowHeight
                    + 25
                )
            }`
        )

        for (const edge of edges) {
            const a =
                positions.get(edge.from)

            const b =
                positions.get(edge.to)

            if (!a || !b)
                continue

            const field =
                edge.kind === "field"

            svg.innerHTML +=
                `<line class="edgeLine ${field ? "edgeField" : ""}"`
                + ` x1="${a.x}" y1="${a.y+15}"`
                + ` x2="${b.x+150}" y2="${b.y+15}"/>`
                + `<text class="edgeText"`
                + ` x="${(a.x+b.x+150)/2}"`
                + ` y="${(a.y+b.y)/2+10}">`
                + `${esc(field ? edge.label || "field" : edge.kind)}`
                + `</text>`
        }

        for (const node of nodes) {
            const p =
                positions.get(node.name)

            svg.innerHTML +=
                `<rect class="nodeBox ${node.observed ? "observed" : ""}"`
                + ` x="${p.x}" y="${p.y}"`
                + ` width="150" height="31"`
                + ` rx="6"/>`
                + `<text class="nodeText"`
                + ` x="${p.x+6}" y="${p.y+13}">`
                + `${esc(node.simpleName || short(node.name)).slice(0,23)}`
                + `</text>`
                + `<text class="edgeText"`
                + ` x="${p.x+6}" y="${p.y+25}">`
                + `${esc(node.kind)}`
                + `</text>`
        }

        $("architectureTable").innerHTML =
            `<div class="card small">`
            + `${nodes.length} classes · `
            + `${edges.length} relations · `
            + `solid = inheritance/interface · `
            + `dashed = field dependency`
            + `</div>`
    }

    function renderAll() {
        if (!latest)
            return

        renderScene()

        renderObjects(
            "states",
            latest.appStates,
            "AppState"
        )

        renderObjects(
            "watched",
            latest.watchedObjects,
            "Object"
        )

        renderDetails()
        renderArchitecture()
        renderWorkflow()
        renderEngine()

        const stats =
            latest.stats || {}

        $("status").textContent =
            `live · ${
                new Date(
                    latest.timestampMillis
                ).toLocaleTimeString()
            } · ${
                Number(
                    stats.visitedSceneNodes || 0
                )
            } spatials${
                stats.truncated
                    ? " · truncated"
                    : ""
            }`
    }

    async function post(path) {
        try {
            await fetch(
                path,
                {
                    method:"POST"
                }
            )

            setTimeout(
                tick,
                30
            )
        } catch (_) {}
    }

    async function tick() {
        try {
            const response =
                await fetch(
                    "/api/snapshot",
                    {
                        cache:"no-store"
                    }
                )

            latest =
                await response.json()

            renderAll()
        } catch (_) {
            $("status").textContent =
                "disconnected"
        }
    }

    $("search")
        .addEventListener(
            "input",
            renderAll
        )

    $("refresh").onclick =
        () =>
            post(
                "/api/snapshot/refresh"
            )

    $("clearTrace").onclick =
        () =>
            post(
                "/api/trace/clear"
            )

    $("clearEngine").onclick =
        () =>
            post(
                "/api/engine-profile/clear"
            )

    document
        .querySelectorAll(
            ".tabs button"
        )
        .forEach(
            button =>
                button.onclick = () => {
                    document
                        .querySelectorAll(
                            ".tabs button"
                        )
                        .forEach(
                            other =>
                                other.classList.toggle(
                                    "active",
                                    other === button
                                )
                        )

                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            tab =>
                                tab.classList.toggle(
                                    "active",
                                    tab.id
                                    === button.dataset.tab
                                )
                        )
                }
        )

    setInterval(
        tick,
        250
    )

    tick()
</script>

</body>
</html>
