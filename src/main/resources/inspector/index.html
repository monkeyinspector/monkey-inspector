<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Monkey Inspector 0.3.0</title>

    <style>
        :root{
            color-scheme:dark;
            font-family:Inter,system-ui,sans-serif
        }

        *{box-sizing:border-box}

        body{
            margin:0;
            background:#101217;
            color:#e7ebf2;
            overflow:hidden
        }

        header{
            height:48px;
            display:flex;
            align-items:center;
            gap:10px;
            padding:0 12px;
            background:#171a20;
            border-bottom:1px solid #2a303a
        }

        header strong{white-space:nowrap}

        header input{
            width:min(360px,36vw);
            background:#101319;
            border:1px solid #343c49;
            color:inherit;
            border-radius:6px;
            padding:6px 9px
        }

        #status{
            margin-left:auto;
            font-size:12px;
            opacity:.65
        }

        button{
            background:#242b35;
            color:inherit;
            border:1px solid #3a4351;
            border-radius:6px;
            padding:5px 8px;
            cursor:pointer
        }

        button:hover{background:#2d3643}

        main{
            height:calc(100vh - 48px);
            display:grid;
            grid-template-columns:31% 32% 37%
        }

        .panel{
            min-width:0;
            overflow:auto;
            border-right:1px solid #2a303a
        }

        h2{
            position:sticky;
            top:0;
            z-index:3;
            margin:0;
            padding:9px 11px;
            font-size:11px;
            text-transform:uppercase;
            letter-spacing:.12em;
            background:#171a20;
            border-bottom:1px solid #2a303a
        }

        .section{padding:8px 9px 15px}

        ul.tree,
        ul.tree ul{
            list-style:none;
            margin:0;
            padding-left:15px
        }

        ul.tree{padding-left:0}

        .row{
            display:flex;
            align-items:center;
            gap:6px;
            min-height:25px;
            padding:2px 5px;
            border-radius:5px;
            cursor:pointer;
            white-space:nowrap
        }

        .row:hover{background:#222832}

        .row.selected{background:#2b3543}

        .twisty{
            width:12px;
            opacity:.65;
            flex:none
        }

        .kind{
            font-size:9px;
            padding:1px 4px;
            border:1px solid #3b4553;
            border-radius:4px;
            opacity:.8
        }

        .name{
            overflow:hidden;
            text-overflow:ellipsis
        }

        .muted{
            opacity:.5;
            font-size:11px;
            overflow:hidden;
            text-overflow:ellipsis
        }

        .card{
            border:1px solid #303743;
            background:#171b22;
            border-radius:7px;
            padding:9px;
            margin:7px 0
        }

        .kv{
            display:grid;
            grid-template-columns:115px minmax(0,1fr);
            gap:5px 9px;
            font-size:12px
        }

        .kv b{
            opacity:.6;
            font-weight:500
        }

        .chain{
            display:flex;
            flex-direction:column;
            gap:3px;
            font:11px ui-monospace,monospace
        }

        .chain div::before{
            content:"↳ ";
            opacity:.4
        }

        .fields{
            width:100%;
            border-collapse:collapse;
            font-size:11px
        }

        .fields th,
        .fields td{
            padding:5px 6px;
            border-bottom:1px solid #292f39;
            text-align:left;
            vertical-align:top
        }

        .fields th{
            opacity:.55;
            font-weight:500
        }

        .empty{
            padding:14px;
            opacity:.5;
            font-size:12px
        }

        .tabs{
            position:sticky;
            top:0;
            z-index:4;
            display:flex;
            gap:5px;
            padding:7px;
            background:#171a20;
            border-bottom:1px solid #2a303a
        }

        .tabs button.active{
            background:#394556
        }

        .tab{
            display:none;
            padding:8px
        }

        .tab.active{display:block}

        .graphFrame{
            position:relative
        }

        .graphToolbar{
            position:absolute;
            top:8px;
            right:8px;
            z-index:2;
            display:flex;
            align-items:center;
            gap:4px;
            padding:4px;
            background:rgba(23,26,32,.9);
            border:1px solid #343d49;
            border-radius:7px;
            backdrop-filter:blur(5px)
        }

        .graphToolbar button{
            min-width:27px;
            padding:3px 7px
        }

        .graphToolbar .zoomValue{
            min-width:42px;
            color:#aab4c3;
            font:10px ui-monospace,monospace;
            text-align:center
        }

        svg.graph{
            display:block;
            width:100%;
            min-height:280px;
            background:#12151a;
            border:1px solid #2c333e;
            border-radius:7px;
            cursor:grab;
            touch-action:none;
            user-select:none
        }

        svg.graph.dragging{cursor:grabbing}

        .nodeBox{
            fill:#1d232c;
            stroke:#465267
        }

        .nodeBox.observed{
            stroke-width:2
        }

        .nodeText{
            font:10px ui-monospace,monospace;
            fill:#edf1f7
        }

        .edgeText{
            font:9px ui-monospace,monospace;
            fill:#aab4c3
        }

        .edgeLabel{
            font:9px ui-monospace,monospace;
            fill:#d5dde9;
            opacity:0;
            pointer-events:none;
            paint-order:stroke;
            stroke:#12151a;
            stroke-width:3px;
            stroke-linejoin:round
        }

        .edgeLine{
            stroke:#68788e;
            stroke-width:1.1;
            fill:none;
            marker-end:url(#arrow);
            pointer-events:stroke;
            vector-effect:non-scaling-stroke;
            transition:stroke .12s,opacity .12s
        }

        .graphEdge{opacity:.48}

        .graphEdge:hover{opacity:1}

        .graphEdge:hover .edgeLine{
            stroke:#a9bbd2;
            stroke-width:1.7
        }

        .graphEdge:hover .edgeLabel{opacity:1}

        .edgeField{
            stroke-dasharray:4 3
        }

        .metrics{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:7px;
            margin-bottom:8px
        }

        .metric{
            border:1px solid #303743;
            background:#171b22;
            border-radius:7px;
            padding:8px
        }

        .metric b{
            display:block;
            font-size:10px;
            opacity:.55
        }

        .metric span{
            font:13px ui-monospace,monospace
        }

        .small{
            font-size:11px;
            opacity:.65
        }
    </style>
</head>

<body>

<header>
    <strong>🐒 Monkey Inspector <span class="small">0.3.0</span></strong>
    <input id="search" placeholder="Search scene / class / object…">
    <button id="refresh">Refresh</button>
    <span id="status">connecting…</span>
</header>

<main>

    <section class="panel">
        <h2>Scene Graph</h2>
        <div id="scene" class="section"></div>

        <h2>App States</h2>
        <div id="states" class="section"></div>
    </section>

    <section class="panel">
        <h2>Selection / Live Properties</h2>
        <div id="details" class="section">
            <div class="empty">Select an object.</div>
        </div>

        <h2>Watched Objects</h2>
        <div id="watched" class="section"></div>
    </section>

    <section class="panel">

        <div class="tabs">
            <button data-tab="architecture" class="active">
                Architecture
            </button>

            <button data-tab="workflow">
                Workflow
            </button>

            <button data-tab="engine">
                Engine
            </button>
        </div>

        <div id="architecture" class="tab active">
            <div class="graphFrame">
                <div class="graphToolbar" aria-label="Architecture graph zoom">
                    <button type="button" data-zoom-target="architectureGraph" data-zoom="in" title="Zoom in">+</button>
                    <button type="button" data-zoom-target="architectureGraph" data-zoom="out" title="Zoom out">−</button>
                    <button type="button" data-zoom-target="architectureGraph" data-zoom="reset" title="Reset zoom">Reset</button>
                    <span id="architectureGraphZoom" class="zoomValue">100%</span>
                </div>
                <svg id="architectureGraph" class="graph"></svg>
            </div>
            <div id="architectureTable"></div>
        </div>

        <div id="workflow" class="tab">
            <div style="text-align:right">
                <button id="clearTrace">Clear trace</button>
            </div>

            <div class="graphFrame">
                <div class="graphToolbar" aria-label="Workflow graph zoom">
                    <button type="button" data-zoom-target="workflowGraph" data-zoom="in" title="Zoom in">+</button>
                    <button type="button" data-zoom-target="workflowGraph" data-zoom="out" title="Zoom out">−</button>
                    <button type="button" data-zoom-target="workflowGraph" data-zoom="reset" title="Reset zoom">Reset</button>
                    <span id="workflowGraphZoom" class="zoomValue">100%</span>
                </div>
                <svg id="workflowGraph" class="graph"></svg>
            </div>
            <div id="traceTable"></div>
        </div>

        <div id="engine" class="tab">
            <div style="text-align:right">
                <button id="clearEngine">
                    Clear engine profile
                </button>
            </div>

            <div id="engineMetrics" class="metrics"></div>

            <div class="graphFrame">
                <div class="graphToolbar" aria-label="Engine graph zoom">
                    <button type="button" data-zoom-target="engineGraph" data-zoom="in" title="Zoom in">+</button>
                    <button type="button" data-zoom-target="engineGraph" data-zoom="out" title="Zoom out">−</button>
                    <button type="button" data-zoom-target="engineGraph" data-zoom="reset" title="Reset zoom">Reset</button>
                    <span id="engineGraphZoom" class="zoomValue">100%</span>
                </div>
                <svg id="engineGraph" class="graph"></svg>
            </div>
            <div id="engineTable"></div>
        </div>

    </section>

</main>

<script>
    let latest = null
    let selectedId = null
    let tickInFlight = false

    const collapsedSceneIds = new Set()
    const searchCollapsedSceneIds = new Set()

    const $ = id => document.getElementById(id)

    const esc = s =>
        String(s ?? "").replace(
            /[&<>"']/g,
            c => ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            })[c]
        )

    const short = name =>
        (name || "").split(".").pop()

    const query = () =>
        $("search").value
            .trim()
            .toLowerCase()

    const fmtNs = value => {
        const n = Number(value || 0)

        if (n >= 1e9)
            return (n / 1e9).toFixed(2) + " s"

        if (n >= 1e6)
            return (n / 1e6).toFixed(2) + " ms"

        if (n >= 1e3)
            return (n / 1e3).toFixed(1) + " µs"

        return n.toFixed(0) + " ns"
    }

    function matches(object) {
        const q = query()

        if (!q)
            return true

        return [
            object?.name,
            object?.kind,
            object?.classInfo?.name,
            object?.classInfo?.simpleName,
            object?.preview
        ].some(
            value =>
                String(value ?? "")
                    .toLowerCase()
                    .includes(q)
        )
    }

    function subtreeMatches(node) {
        if (matches(node))
            return true

        if ((node.controls || []).some(matches))
            return true

        return (node.children || [])
            .some(subtreeMatches)
    }

    function rowFor(
        object,
        label,
        kind
    ) {
        const div =
            document.createElement("div")

        div.className =
            "row"
            + (
                selectedId === object.id
                    ? " selected"
                    : ""
            )

        div.dataset.objectId = object.id

        div.innerHTML =
            `<span class="kind">${esc(kind)}</span>`
            + `<span class="name">${esc(label)}</span>`
            + `<span class="muted">${esc(short(object.classInfo?.name))}</span>`

        div.onclick = () => {
            selectedId = object.id

            document
                .querySelectorAll(".row")
                .forEach(
                    row =>
                        row.classList.toggle(
                            "selected",
                            row.dataset.objectId === selectedId
                        )
                )

            renderDetails()
        }

        return div
    }

    function spatialLi(node) {
        if (!subtreeMatches(node))
            return null

        const li =
            document.createElement("li")

        const children =
            (node.children || [])
                .filter(subtreeMatches)

        const controls =
            (node.controls || [])
                .filter(
                    control =>
                        !query()
                        || matches(control)
                )

        const hasDescendants =
            controls.length > 0
            || children.length > 0

        const collapseState =
            query()
                ? searchCollapsedSceneIds
                : collapsedSceneIds

        const collapsed =
            collapseState.has(node.id)

        const row =
            rowFor(
                node,
                node.name,
                node.kind
            )

        const twisty =
            document.createElement("span")

        twisty.className = "twisty"
        twisty.textContent =
            hasDescendants
                ? collapsed
                    ? "▸"
                    : "▾"
                : ""

        row.prepend(twisty)
        li.appendChild(row)

        if (hasDescendants) {
            const ul =
                document.createElement("ul")

            ul.hidden = collapsed

            for (const control of controls) {
                const item =
                    document.createElement("li")

                const controlRow =
                    rowFor(
                        control,
                        control.name
                        || short(control.classInfo?.name),
                        "Control"
                    )

                const spacer =
                    document.createElement("span")

                spacer.className = "twisty"
                controlRow.prepend(spacer)
                item.appendChild(controlRow)
                ul.appendChild(item)
            }

            for (const child of children) {
                const item =
                    spatialLi(child)

                if (item)
                    ul.appendChild(item)
            }

            li.appendChild(ul)

            twisty.onclick = event => {
                event.stopPropagation()

                const hidden =
                    ul.hidden

                ul.hidden = !hidden

                if (hidden)
                    collapseState.delete(node.id)
                else
                    collapseState.add(node.id)

                twisty.textContent =
                    hidden
                        ? "▾"
                        : "▸"
            }
        }

        return li
    }

    function renderScene() {
        const root = $("scene")

        root.innerHTML = ""

        const ul =
            document.createElement("ul")

        ul.className = "tree"

        for (const node of latest.sceneRoots || []) {
            const item =
                spatialLi(node)

            if (item)
                ul.appendChild(item)
        }

        if (!ul.children.length) {
            root.innerHTML =
                '<div class="empty">No matches.</div>'
        } else {
            root.appendChild(ul)
        }
    }

    function renderObjects(
        target,
        objects,
        kind
    ) {
        const root = $(target)

        root.innerHTML = ""

        const filtered =
            (objects || [])
                .filter(matches)

        if (!filtered.length) {
            root.innerHTML =
                '<div class="empty">None</div>'

            return
        }

        for (const object of filtered) {
            root.appendChild(
                rowFor(
                    object,
                    object.name
                    || short(object.classInfo?.name),
                    kind
                )
            )
        }
    }

    function walkSpatial(
        node,
        predicate
    ) {
        if (predicate(node))
            return node

        for (const control of node.controls || []) {
            if (predicate(control))
                return control
        }

        for (const child of node.children || []) {
            const result =
                walkSpatial(
                    child,
                    predicate
                )

            if (result)
                return result
        }

        return null
    }

    function findSelected() {
        if (!selectedId)
            return null

        for (const root of latest.sceneRoots || []) {
            const result =
                walkSpatial(
                    root,
                    object =>
                        object.id === selectedId
                )

            if (result)
                return result
        }

        for (
            const object of [
            ...(latest.appStates || []),
            ...(latest.watchedObjects || [])
        ]
            ) {
            if (object.id === selectedId)
                return object
        }

        return null
    }

    function renderDetails() {
        const root = $("details")
        const object = findSelected()

        if (!object) {
            root.innerHTML =
                '<div class="empty">Select something.</div>'

            return
        }

        const info =
            object.classInfo || {}

        let props = ""

        for (
            const key of [
            "name",
            "kind",
            "localTranslation",
            "worldTranslation",
            "localRotation",
            "localScale",
            "worldBound",
            "cullHint",
            "queueBucket",
            "meshMode",
            "triangles",
            "vertices",
            "enabled",
            "initialized",
            "preview"
        ]
            ) {
            if (object[key] !== undefined) {
                props +=
                    `<b>${esc(key)}</b>`
                    + `<span>${esc(object[key])}</span>`
            }
        }

        const fields =
            (object.fields || [])
                .map(
                    field =>
                        `<tr>`
                        + `<td>${esc(field.name)}</td>`
                        + `<td>${esc(short(field.type))}</td>`
                        + `<td>${esc(field.value)}</td>`
                        + `</tr>`
                )
                .join("")

        root.innerHTML =
            `<div class="card">`
            + `<div class="kv">${props}</div>`
            + `</div>`
            + `<div class="card">`
            + `<div class="chain">`
            + (info.hierarchy || [])
                .map(
                    name =>
                        `<div>${esc(name)}</div>`
                )
                .join("")
            + `</div>`
            + (
                info.interfaces?.length
                    ? `<div class="small">interfaces<br>`
                    + info.interfaces
                        .map(esc)
                        .join("<br>")
                    + `</div>`
                    : ""
            )
            + `</div>`
            + (
                fields
                    ? `<div class="card">`
                    + `<table class="fields">`
                    + `<thead>`
                    + `<tr>`
                    + `<th>field</th>`
                    + `<th>type</th>`
                    + `<th>live value</th>`
                    + `</tr>`
                    + `</thead>`
                    + `<tbody>${fields}</tbody>`
                    + `</table>`
                    + `</div>`
                    : ""
            )
    }

    function defs() {
        return `
    <defs>
        <marker
            id="arrow"
            markerWidth="8"
            markerHeight="8"
            refX="7"
            refY="3"
            orient="auto"
        >
            <path
                d="M0,0 L0,6 L8,3 z"
                fill="#68788e"
            />
        </marker>
    </defs>
    `
    }

    const graphViews = new Map()

    function updateGraphView(svg,state) {
        svg.setAttribute(
            "viewBox",
            `${state.x} ${state.y} ${state.width} ${state.height}`
        )

        const value = $(`${svg.id}Zoom`)

        if (value) {
            value.textContent =
                `${Math.round(state.baseWidth / state.width * 100)}%`
        }
    }

    function setGraphBounds(svg,width,height) {
        const previous = graphViews.get(svg.id)

        if (!previous) {
            const state = {
                baseWidth:width,
                baseHeight:height,
                x:0,
                y:0,
                width,
                height
            }

            graphViews.set(svg.id,state)
            updateGraphView(svg,state)
            return
        }

        const scale = previous.width / previous.baseWidth
        const centerX =
            (previous.x + previous.width / 2)
            / previous.baseWidth
        const centerY =
            (previous.y + previous.height / 2)
            / previous.baseHeight

        previous.baseWidth = width
        previous.baseHeight = height
        previous.width = width * scale
        previous.height = height * scale
        previous.x = centerX * width - previous.width / 2
        previous.y = centerY * height - previous.height / 2

        updateGraphView(svg,previous)
    }

    function zoomGraph(
        svg,
        factor,
        clientX,
        clientY
    ) {
        const state = graphViews.get(svg.id)

        if (!state)
            return

        const rect = svg.getBoundingClientRect()
        const ratioX = clientX == null
            ? .5
            : (clientX - rect.left) / rect.width
        const ratioY = clientY == null
            ? .5
            : (clientY - rect.top) / rect.height
        const anchorX = state.x + ratioX * state.width
        const anchorY = state.y + ratioY * state.height
        const nextWidth =
            Math.max(
                state.baseWidth * .2,
                Math.min(
                    state.baseWidth * 4,
                    state.width * factor
                )
            )
        const appliedFactor = nextWidth / state.width

        state.width = nextWidth
        state.height *= appliedFactor
        state.x = anchorX - ratioX * state.width
        state.y = anchorY - ratioY * state.height

        updateGraphView(svg,state)
    }

    function resetGraphView(svg) {
        const state = graphViews.get(svg.id)

        if (!state)
            return

        state.x = 0
        state.y = 0
        state.width = state.baseWidth
        state.height = state.baseHeight
        updateGraphView(svg,state)
    }

    function setupGraphNavigation() {
        document
            .querySelectorAll("svg.graph")
            .forEach(
                svg => {
                    let drag = null

                    svg.addEventListener(
                        "wheel",
                        event => {
                            event.preventDefault()
                            zoomGraph(
                                svg,
                                event.deltaY < 0 ? .82 : 1.22,
                                event.clientX,
                                event.clientY
                            )
                        },
                        {passive:false}
                    )

                    svg.addEventListener(
                        "pointerdown",
                        event => {
                            if (event.button !== 0)
                                return

                            const state = graphViews.get(svg.id)

                            if (!state)
                                return

                            drag = {
                                clientX:event.clientX,
                                clientY:event.clientY,
                                x:state.x,
                                y:state.y
                            }

                            svg.setPointerCapture(event.pointerId)
                            svg.classList.add("dragging")
                        }
                    )

                    svg.addEventListener(
                        "pointermove",
                        event => {
                            if (!drag)
                                return

                            const state = graphViews.get(svg.id)
                            const rect = svg.getBoundingClientRect()

                            state.x =
                                drag.x
                                - (event.clientX - drag.clientX)
                                * state.width
                                / rect.width
                            state.y =
                                drag.y
                                - (event.clientY - drag.clientY)
                                * state.height
                                / rect.height

                            updateGraphView(svg,state)
                        }
                    )

                    const stopDrag = () => {
                        drag = null
                        svg.classList.remove("dragging")
                    }

                    svg.addEventListener("pointerup",stopDrag)
                    svg.addEventListener("pointercancel",stopDrag)
                    svg.addEventListener(
                        "dblclick",
                        () => resetGraphView(svg)
                    )
                }
            )

        document
            .querySelectorAll("[data-zoom-target]")
            .forEach(
                button =>
                    button.addEventListener(
                        "click",
                        () => {
                            const svg = $(button.dataset.zoomTarget)

                            if (button.dataset.zoom === "reset")
                                resetGraphView(svg)
                            else
                                zoomGraph(
                                    svg,
                                    button.dataset.zoom === "in"
                                        ? .8
                                        : 1.25
                                )
                        }
                    )
            )
    }

    function layeredLayout(
        names,
        edges,
        depth,
        {
            columnWidth,
            rowHeight,
            nodeWidth,
            top = 18,
            left = 15
        }
    ) {
        const maxDepth =
            Math.max(
                0,
                ...names.map(
                    name => depth.get(name) || 0
                )
            )

        const layers =
            Array.from(
                {length:maxDepth + 1},
                () => []
            )

        const itemLayer = new Map()
        const neighbors = new Map()

        for (const name of names) {
            const layer = depth.get(name) || 0

            layers[layer].push({id:name,dummy:false})
            itemLayer.set(name,layer)
            neighbors.set(name,new Set())
        }

        const routes = []

        edges.forEach(
            (edge,edgeIndex) => {
                const fromDepth = depth.get(edge.from) || 0
                const toDepth = depth.get(edge.to) || 0
                const step = Math.sign(toDepth - fromDepth)
                const route = [edge.from]
                let previous = edge.from

                if (step) {
                    for (
                        let d = fromDepth + step;
                        d !== toDepth;
                        d += step
                    ) {
                        const id = `__route_${edgeIndex}_${d}`

                        layers[d].push({id,dummy:true})
                        itemLayer.set(id,d)
                        neighbors.set(id,new Set())
                        neighbors.get(previous).add(id)
                        neighbors.get(id).add(previous)
                        route.push(id)
                        previous = id
                    }
                }

                neighbors.get(previous).add(edge.to)
                neighbors.get(edge.to).add(previous)
                route.push(edge.to)
                routes.push(route)
            }
        )

        const rank = new Map()

        function refreshRanks() {
            layers.forEach(
                layer =>
                    layer.forEach(
                        (item,index) => rank.set(item.id,index)
                    )
            )
        }

        function sortLayer(layerIndex,neighborLayer) {
            refreshRanks()

            const stable =
                new Map(
                    layers[layerIndex].map(
                        (item,index) => [item.id,index]
                    )
                )

            const score = item => {
                const connected =
                    [...(neighbors.get(item.id) || [])]
                        .filter(
                            id => itemLayer.get(id) === neighborLayer
                        )

                return connected.length
                    ? connected.reduce(
                        (sum,id) => sum + (rank.get(id) || 0),
                        0
                    ) / connected.length
                    : stable.get(item.id)
            }

            layers[layerIndex].sort(
                (a,b) =>
                    score(a) - score(b)
                    || stable.get(a.id) - stable.get(b.id)
            )
        }

        for (let pass = 0; pass < 6; pass++) {
            for (let d = 1; d < layers.length; d++)
                sortLayer(d,d - 1)

            for (let d = layers.length - 2; d >= 0; d--)
                sortLayer(d,d + 1)
        }

        const maxRows =
            Math.max(
                1,
                ...layers.map(layer => layer.length)
            )

        const positions = new Map()

        layers.forEach(
            (layer,d) => {
                const offset =
                    (maxRows - layer.length)
                    * rowHeight
                    / 2

                layer.forEach(
                    (item,index) =>
                        positions.set(
                            item.id,
                            {
                                x:left + d * columnWidth,
                                y:top + offset + index * rowHeight
                            }
                        )
                )
            }
        )

        return {
            positions,
            routes,
            width:Math.max(
                620,
                (maxDepth + 1) * columnWidth + 110
            ),
            height:Math.max(
                280,
                maxRows * rowHeight + top * 2
            ),
            nodeWidth
        }
    }

    function routedEdge(
        layout,
        route,
        edgeIndex,
        label,
        extraClass = ""
    ) {
        const points =
            route.map(id => layout.positions.get(id))

        const first = points[0]
        const last = points[points.length - 1]
        const centerY = 16

        if (!first || !last)
            return ""

        let path
        let labelX
        let labelY

        if (points.length === 2 && first.x === last.x) {
            const right =
                first.x
                + layout.nodeWidth
                + 24
                + (edgeIndex % 10) * 7

            const startX = first.x + layout.nodeWidth
            const startY = first.y + centerY
            const endX = last.x + layout.nodeWidth
            const endY = last.y + centerY
            const selfLoop = route[0] === route[1]

            path = selfLoop
                ? `M ${startX} ${startY - 7}`
                    + ` H ${right}`
                    + ` V ${endY + 12}`
                    + ` H ${endX}`
                : `M ${startX} ${startY}`
                    + ` H ${right} V ${endY} H ${endX}`
            labelX = right + 3
            labelY = selfLoop
                ? startY - 10
                : (startY + endY) / 2 - 3
        } else {
            const forward = last.x > first.x
            const routed =
                points.map(
                    (point,index) => ({
                        x:index === 0
                            ? point.x + (forward ? layout.nodeWidth : 0)
                            : index === points.length - 1
                                ? point.x + (forward ? 0 : layout.nodeWidth)
                                : point.x + layout.nodeWidth / 2,
                        y:point.y + centerY
                    })
                )

            path = `M ${routed[0].x} ${routed[0].y}`

            for (let i = 1; i < routed.length; i++) {
                const a = routed[i - 1]
                const b = routed[i]
                const middle = (a.x + b.x) / 2

                path +=
                    ` C ${middle} ${a.y},`
                    + ` ${middle} ${b.y},`
                    + ` ${b.x} ${b.y}`
            }

            const middlePoint =
                routed[Math.floor(routed.length / 2)]

            labelX = middlePoint.x + 4
            labelY = middlePoint.y - 5
        }

        return `<g class="graphEdge">`
            + `<path class="edgeLine ${extraClass}" d="${path}">`
            + `<title>${esc(label)}</title>`
            + `</path>`
            + `<text class="edgeLabel" x="${labelX}" y="${labelY}">`
            + `${esc(label)}`
            + `</text>`
            + `</g>`
    }

    function renderFlowGraph(
        id,
        data,
        emptyText,
        maxNodes = 70
    ) {
        const svg = $(id)

        const nodes =
            (data?.nodes || [])
                .slice()
                .sort(
                    (a,b) =>
                        Number(
                            b.totalNanos || b.calls
                        )
                        -
                        Number(
                            a.totalNanos || a.calls
                        )
                )
                .slice(
                    0,
                    maxNodes
                )

        const allowed =
            new Set(
                nodes.map(
                    node => node.name
                )
            )

        const edges =
            (data?.edges || [])
                .filter(
                    edge =>
                        allowed.has(edge.from)
                        && allowed.has(edge.to)
                )

        svg.innerHTML = defs()

        if (!nodes.length) {
            setGraphBounds(svg,600,120)

            svg.innerHTML +=
                `<text x="18" y="42" class="nodeText" opacity=".55">`
                + `${esc(emptyText)}`
                + `</text>`

            return
        }

        const incoming =
            new Map(
                nodes.map(
                    node => [
                        node.name,
                        0
                    ]
                )
            )

        for (const edge of edges) {
            incoming.set(
                edge.to,
                (incoming.get(edge.to) || 0)
                + 1
            )
        }

        const depth =
            new Map()

        const queue =
            nodes
                .filter(
                    node =>
                        (incoming.get(node.name) || 0)
                        === 0
                )
                .map(
                    node => node.name
                )

        for (const name of queue)
            depth.set(name,0)

        while (queue.length) {
            const current =
                queue.shift()

            const currentDepth =
                depth.get(current) || 0

            for (
                const edge of edges.filter(
                edge =>
                    edge.from === current
            )
                ) {
                depth.set(
                    edge.to,
                    Math.min(
                        6,
                        Math.max(
                            depth.get(edge.to) || 0,
                            currentDepth + 1
                        )
                    )
                )

                incoming.set(
                    edge.to,
                    (incoming.get(edge.to) || 0) - 1
                )

                if (incoming.get(edge.to) === 0)
                    queue.push(edge.to)
            }
        }

        for (const node of nodes) {
            if (!depth.has(node.name))
                depth.set(node.name,0)
        }

        const layout =
            layeredLayout(
                nodes.map(node => node.name),
                edges,
                depth,
                {
                    columnWidth:190,
                    rowHeight:58,
                    nodeWidth:145
                }
            )

        setGraphBounds(svg,layout.width,layout.height)

        edges.forEach(
            (edge,index) =>
            svg.innerHTML +=
                routedEdge(
                    layout,
                    layout.routes[index],
                    index,
                    edge.calls ?? ""
                )
        )

        for (const node of nodes) {
            const p =
                layout.positions.get(node.name)

            const average =
                node.calls
                    ? Number(node.totalNanos || 0)
                    / Number(node.calls)
                    : 0

            svg.innerHTML +=
                `<rect class="nodeBox"`
                + ` x="${p.x}" y="${p.y}"`
                + ` width="145" height="33"`
                + ` rx="6"/>`
                + `<text class="nodeText"`
                + ` x="${p.x+6}" y="${p.y+13}">`
                + `${esc(short(node.name)).slice(0,22)}`
                + `</text>`
                + `<text class="edgeText"`
                + ` x="${p.x+6}" y="${p.y+27}">`
                + `${Number(node.calls || 0)}× · ${esc(fmtNs(average))}`
                + `</text>`
        }
    }

    function renderWorkflow() {
        const trace =
            latest.trace || {}

        renderFlowGraph(
            "workflowGraph",
            trace,
            "No trace data. Use InspectorTrace.runSpan(...)"
        )

        const nodes =
            (trace.nodes || [])
                .slice()
                .sort(
                    (a,b) =>
                        Number(b.selfNanos || 0)
                        -
                        Number(a.selfNanos || 0)
                )
                .slice(0,40)

        $("traceTable").innerHTML =
            nodes.length
                ? `<div class="card">`
                + `<table class="fields">`
                + `<thead><tr>`
                + `<th>span</th>`
                + `<th>calls</th>`
                + `<th>avg</th>`
                + `<th>self</th>`
                + `<th>max</th>`
                + `<th>fail</th>`
                + `</tr></thead>`
                + `<tbody>`
                + nodes.map(
                    node =>
                        `<tr>`
                        + `<td>${esc(node.name)}</td>`
                        + `<td>${node.calls}</td>`
                        + `<td>${esc(fmtNs(node.calls ? node.totalNanos/node.calls : 0))}</td>`
                        + `<td>${esc(fmtNs(node.selfNanos))}</td>`
                        + `<td>${esc(fmtNs(node.maxNanos))}</td>`
                        + `<td>${node.failures || 0}</td>`
                        + `</tr>`
                ).join("")
                + `</tbody>`
                + `</table>`
                + `</div>`
                : ""
    }

    function renderEngine() {
        const profile =
            latest.engineProfile || {}

        renderFlowGraph(
            "engineGraph",
            profile,
            "Engine profiling disabled.",
            80
        )

        $("engineMetrics").innerHTML =
            `<div class="metric">`
            + `<b>frames</b>`
            + `<span>${Number(profile.frames || 0)}</span>`
            + `</div>`
            + `<div class="metric">`
            + `<b>avg frame</b>`
            + `<span>${esc(fmtNs(profile.averageFrameNanos || 0))}</span>`
            + `</div>`
            + `<div class="metric">`
            + `<b>max frame</b>`
            + `<span>${esc(fmtNs(profile.maxFrameNanos || 0))}</span>`
            + `</div>`

        const nodes =
            (profile.nodes || [])
                .slice()
                .sort(
                    (a,b) =>
                        Number(b.totalNanos || 0)
                        -
                        Number(a.totalNanos || 0)
                )
                .slice(0,50)

        $("engineTable").innerHTML =
            nodes.length
                ? `<div class="card">`
                + `<table class="fields">`
                + `<thead><tr>`
                + `<th>jME phase</th>`
                + `<th>calls</th>`
                + `<th>avg</th>`
                + `<th>max</th>`
                + `</tr></thead>`
                + `<tbody>`
                + nodes.map(
                    node =>
                        `<tr>`
                        + `<td>${esc(node.name)}</td>`
                        + `<td>${node.calls}</td>`
                        + `<td>${esc(fmtNs(node.calls ? node.totalNanos/node.calls : 0))}</td>`
                        + `<td>${esc(fmtNs(node.maxNanos))}</td>`
                        + `</tr>`
                ).join("")
                + `</tbody>`
                + `</table>`
                + `</div>`
                : ""
    }

    function renderArchitecture() {
        const data =
            latest.architecture
            || {
                nodes:[],
                edges:[]
            }

        let nodes =
            data.nodes || []

        let edges =
            data.edges || []

        const q =
            query()

        if (q) {
            const hit =
                new Set(
                    nodes
                        .filter(
                            node =>
                                (
                                    node.name
                                    + " "
                                    + node.simpleName
                                    + " "
                                    + node.packageName
                                )
                                    .toLowerCase()
                                    .includes(q)
                        )
                        .map(
                            node => node.name
                        )
                )

            for (const edge of edges) {
                if (
                    hit.has(edge.from)
                    || hit.has(edge.to)
                ) {
                    hit.add(edge.from)
                    hit.add(edge.to)
                }
            }

            nodes =
                nodes.filter(
                    node =>
                        hit.has(node.name)
                )

            edges =
                edges.filter(
                    edge =>
                        hit.has(edge.from)
                        && hit.has(edge.to)
                )
        }

        nodes =
            nodes.slice(0,100)

        const allowed =
            new Set(
                nodes.map(
                    node => node.name
                )
            )

        edges =
            edges.filter(
                edge =>
                    allowed.has(edge.from)
                    && allowed.has(edge.to)
            )

        const svg =
            $("architectureGraph")

        svg.innerHTML =
            defs()

        if (!nodes.length) {
            setGraphBounds(svg,600,120)

            $("architectureTable").innerHTML = ""

            svg.innerHTML +=
                `<text x="18" y="42"`
                + ` class="nodeText"`
                + ` opacity=".55">`
                + `No classes.`
                + `</text>`

            return
        }

        const inheritance =
            edges.filter(
                edge =>
                    edge.kind === "extends"
                    || edge.kind === "implements"
            )

        const depth =
            new Map()

        function getDepth(
            name,
            seen = new Set()
        ) {
            if (depth.has(name))
                return depth.get(name)

            if (seen.has(name))
                return 0

            seen.add(name)

            const parents =
                inheritance
                    .filter(
                        edge =>
                            edge.from === name
                    )
                    .map(
                        edge => edge.to
                    )

            const value =
                parents.length
                    ? 1 + Math.max(
                    ...parents.map(
                        parent =>
                            getDepth(
                                parent,
                                new Set(seen)
                            )
                    )
                )
                    : 0

            depth.set(
                name,
                Math.min(
                    value,
                    7
                )
            )

            return depth.get(name)
        }

        for (const node of nodes)
            getDepth(node.name)

        const layout =
            layeredLayout(
                nodes.map(node => node.name),
                edges,
                depth,
                {
                    columnWidth:205,
                    rowHeight:56,
                    nodeWidth:150,
                    top:16
                }
            )

        setGraphBounds(svg,layout.width,layout.height)

        edges.forEach(
            (edge,index) => {
            const field =
                edge.kind === "field"

            svg.innerHTML +=
                routedEdge(
                    layout,
                    layout.routes[index],
                    index,
                    field ? edge.label || "field" : edge.kind,
                    field ? "edgeField" : ""
                )
        })

        for (const node of nodes) {
            const p =
                layout.positions.get(node.name)

            svg.innerHTML +=
                `<rect class="nodeBox ${node.observed ? "observed" : ""}"`
                + ` x="${p.x}" y="${p.y}"`
                + ` width="150" height="31"`
                + ` rx="6"/>`
                + `<text class="nodeText"`
                + ` x="${p.x+6}" y="${p.y+13}">`
                + `${esc(node.simpleName || short(node.name)).slice(0,23)}`
                + `</text>`
                + `<text class="edgeText"`
                + ` x="${p.x+6}" y="${p.y+25}">`
                + `${esc(node.kind)}`
                + `</text>`
        }

        $("architectureTable").innerHTML =
            `<div class="card small">`
            + `${nodes.length} classes · `
            + `${edges.length} relations · `
            + `solid = inheritance/interface · `
            + `dashed = field dependency`
            + `</div>`
    }

    function renderAll() {
        if (!latest)
            return

        renderScene()

        renderObjects(
            "states",
            latest.appStates,
            "AppState"
        )

        renderObjects(
            "watched",
            latest.watchedObjects,
            "Object"
        )

        renderDetails()
        renderArchitecture()
        renderWorkflow()
        renderEngine()

        const stats =
            latest.stats || {}

        $("status").textContent =
            `live · ${
                new Date(
                    latest.timestampMillis
                ).toLocaleTimeString()
            } · ${
                Number(
                    stats.visitedSceneNodes || 0
                )
            } spatials${
                stats.truncated
                    ? " · truncated"
                    : ""
            }`
    }

    async function post(path) {
        try {
            await fetch(
                path,
                {
                    method:"POST"
                }
            )

            setTimeout(
                tick,
                30
            )
        } catch (_) {}
    }

    async function tick() {
        if (tickInFlight)
            return

        tickInFlight = true

        try {
            const response =
                await fetch(
                    "/api/snapshot",
                    {
                        cache:"no-store"
                    }
                )

            latest =
                await response.json()

            renderAll()
        } catch (_) {
            $("status").textContent =
                "disconnected"
        } finally {
            tickInFlight = false
        }
    }

    $("search")
        .addEventListener(
            "input",
            () => {
                searchCollapsedSceneIds.clear()
                renderAll()
            }
        )

    $("refresh").onclick =
        () =>
            post(
                "/api/snapshot/refresh"
            )

    $("clearTrace").onclick =
        () =>
            post(
                "/api/trace/clear"
            )

    $("clearEngine").onclick =
        () =>
            post(
                "/api/engine-profile/clear"
            )

    document
        .querySelectorAll(
            ".tabs button"
        )
        .forEach(
            button =>
                button.onclick = () => {
                    document
                        .querySelectorAll(
                            ".tabs button"
                        )
                        .forEach(
                            other =>
                                other.classList.toggle(
                                    "active",
                                    other === button
                                )
                        )

                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            tab =>
                                tab.classList.toggle(
                                    "active",
                                    tab.id
                                    === button.dataset.tab
                                )
                        )
                }
        )

    setupGraphNavigation()

    setInterval(
        tick,
        250
    )

    tick()
</script>
